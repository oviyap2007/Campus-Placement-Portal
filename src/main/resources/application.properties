# ================================================
# Campus Placement Portal - Application Properties
# ================================================

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/campus_placement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=JaNaNi@#90920
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — 'update' keeps existing data, 'create-drop' resets on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Server
server.port=8080
spring.application.name=CampusPlacementPortal

# Max upload size (optional)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB