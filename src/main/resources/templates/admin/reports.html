<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Placement Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<!-- PlaCamp Aurora Background -->
<div class="page-bg">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="aurora a4"></div>
    <div class="grid"></div>
    <div class="particles">
        <span style="width:4px;height:4px;background:#a78bfa;top:20%;left:30%;animation-delay:0s"></span>
        <span style="width:3px;height:3px;background:#67e8f9;top:40%;left:70%;animation-delay:-.8s"></span>
        <span style="width:5px;height:5px;background:#f9a8d4;top:65%;left:25%;animation-delay:-1.6s"></span>
        <span style="width:3px;height:3px;background:#fbbf24;top:80%;left:55%;animation-delay:-2.4s"></span>
        <span style="width:4px;height:4px;background:#34d399;top:10%;left:50%;animation-delay:-3.2s"></span>
        <span style="width:3px;height:3px;background:#f472b6;top:55%;right:25%;animation-delay:-.5s"></span>
        <span style="width:4px;height:4px;background:#818cf8;top:30%;right:15%;animation-delay:-1.2s"></span>
        <span style="width:3px;height:3px;background:#2dd4bf;top:75%;right:40%;animation-delay:-2s"></span>
    </div>
</div>
<div class="page-content">
<nav class="navbar">
    <div class="nav-brand">🛡 Admin Panel</div>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/students}">Students</a>
        <a th:href="@{/admin/companies}">Companies</a>
        <a th:href="@{/admin/jobs}">Jobs</a>
        <a th:href="@{/admin/applications}">Applications</a>
        <a th:href="@{/admin/reports}" class="active">Reports</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</nav>
<div class="main-content">
    <div class="page-header"><h2>📊 Placement Reports</h2></div>

    <!-- Summary Cards -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">🎓</div>
            <div class="stat-value" th:text="${totalStudents}">0</div>
            <div class="stat-label">Total Students</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div>
            <div class="stat-value" th:text="${placedStudents}">0</div>
            <div class="stat-label">Placed</div></div>
        <div class="stat-card"><div class="stat-icon">🔍</div>
            <div class="stat-value" th:text="${unplacedStudents}">0</div>
            <div class="stat-label">Unplaced</div></div>
        <div class="stat-card"><div class="stat-icon">📈</div>
            <div class="stat-value" th:text="${placementRate + '%'}">0%</div>
            <div class="stat-label">Placement Rate</div></div>
        <div class="stat-card"><div class="stat-icon">🏢</div>
            <div class="stat-value" th:text="${totalCompanies}">0</div>
            <div class="stat-label">Companies</div></div>
        <div class="stat-card"><div class="stat-icon">💼</div>
            <div class="stat-value" th:text="${activeJobs}">0</div>
            <div class="stat-label">Active Jobs</div></div>
    </div>

    <!-- Placement Progress Bar -->
    <div class="card">
        <h3>📈 Placement Progress</h3>
        <div class="report-progress-label">
            <span th:text="${placedStudents} + ' placed out of ' + ${totalStudents} + ' students'"></span>
            <span th:text="${placementRate + '%'}"></span>
        </div>
        <div class="score-bar-container large">
            <div class="score-bar"
                 th:style="'width:' + ${placementRate} + '%'"></div>
        </div>
    </div>

    <!-- Placed Students List -->
    <div class="card">
        <h3>✅ Placed Students</h3>
        <div th:if="${#lists.isEmpty(placedList)}" class="empty-state"><p>No students placed yet.</p></div>
        <table th:if="${!#lists.isEmpty(placedList)}" class="data-table">
            <thead><tr><th>Name</th><th>Department</th><th>CGPA</th><th>Email</th></tr></thead>
            <tbody>
                <tr th:each="s : ${placedList}">
                    <td><b th:text="${s.name}"></b></td>
                    <td th:text="${s.department}"></td>
                    <td th:text="${s.cgpa}"></td>
                    <td th:text="${s.email}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>
</body>
</html>
