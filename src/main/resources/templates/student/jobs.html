<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Jobs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- PlaCamp Aurora Background -->
<div class="page-bg">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="aurora a4"></div>
    <div class="grid"></div>
    <div class="particles">
        <span style="width:4px;height:4px;background:#a78bfa;top:20%;left:30%;animation-delay:0s"></span>
        <span style="width:3px;height:3px;background:#67e8f9;top:40%;left:70%;animation-delay:-.8s"></span>
        <span style="width:5px;height:5px;background:#f9a8d4;top:65%;left:25%;animation-delay:-1.6s"></span>
        <span style="width:3px;height:3px;background:#fbbf24;top:80%;left:55%;animation-delay:-2.4s"></span>
        <span style="width:4px;height:4px;background:#34d399;top:10%;left:50%;animation-delay:-3.2s"></span>
        <span style="width:3px;height:3px;background:#f472b6;top:55%;right:25%;animation-delay:-.5s"></span>
        <span style="width:4px;height:4px;background:#818cf8;top:30%;right:15%;animation-delay:-1.2s"></span>
        <span style="width:3px;height:3px;background:#2dd4bf;top:75%;right:40%;animation-delay:-2s"></span>
    </div>
</div>
<div class="page-content">

<nav class="navbar">
    <div class="nav-brand">🎓 PlaCamp</div>
    <div class="nav-links">
        <a th:href="@{/student/dashboard}">Dashboard</a>
        <a th:href="@{/student/jobs}" class="active">Jobs</a>
        <a th:href="@{/student/applications}">My Applications</a>
        <a th:href="@{/student/recommendations}">AI Recommendations</a>
        <a th:href="@{/student/profile}">Profile</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="main-content">
    <div class="page-header">
        <h2>💼 Available Jobs</h2>
        <p>Jobs eligible for your CGPA of <b th:text="${student.cgpa}"></b></p>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <!-- No jobs -->
    <div th:if="${#lists.isEmpty(jobs)}" class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>No eligible jobs available right now. Check back later!</p>
    </div>

    <!-- Jobs table -->
    <div th:if="${!#lists.isEmpty(jobs)}" class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Domain</th>
                    <th>Salary</th>
                    <th>Min CGPA</th>
                    <th>Deadline</th>
                    <th>Required Skills</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.jobId}"></td>
                    <td><b th:text="${job.title}"></b></td>
                    <td th:text="${job.companyName != null ? job.companyName : 'N/A'}"></td>
                    <td th:text="${job.domain != null and !job.domain.isEmpty() ? job.domain : '-'}"></td>
                    <td th:text="${job.formattedSalary}"></td>
                    <td th:text="${job.minCgpa}"></td>
                    <td th:text="${job.deadline}"></td>
                    <td>
                        <span th:if="${job.requiredSkills != null and !job.requiredSkills.isEmpty()}"
                              th:text="${job.requiredSkills}" class="skills-tag"></span>
                        <span th:unless="${job.requiredSkills != null and !job.requiredSkills.isEmpty()}"
                              class="text-muted">—</span>
                    </td>
                    <td>
                        <form th:action="@{/student/apply/{id}(id=${job.jobId})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Apply</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>
</body>
</html>
