<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Applications</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🎓 Campus Placement Portal</div>
    <div class="nav-links">
        <a th:href="@{/student/dashboard}">Dashboard</a>
        <a th:href="@{/student/jobs}">Jobs</a>
        <a th:href="@{/student/applications}" class="active">My Applications</a>
        <a th:href="@{/student/recommendations}">AI Recommendations</a>
        <a th:href="@{/student/profile}">Profile</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="main-content">
    <div class="page-header">
        <h2>📋 My Applications</h2>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(apps)}" class="empty-state">
        <div class="empty-icon">📭</div>
        <p>You haven't applied for any jobs yet.</p>
        <a th:href="@{/student/jobs}" class="btn btn-primary">Browse Jobs</a>
    </div>

    <div th:if="${!#lists.isEmpty(apps)}" class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Applied On</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${apps}">
                    <td th:text="${app.applicationId}"></td>
                    <td><b th:text="${app.jobTitle != null ? app.jobTitle : 'Job #' + app.jobId}"></b></td>
                    <td th:text="${app.companyName != null ? app.companyName : 'N/A'}"></td>
                    <td th:text="${app.applyDate}"></td>
                    <td>
                        <span class="badge" th:classappend="${app.statusBadgeClass}"
                              th:text="${app.status}"></span>
                    </td>
                    <td>
                        <form th:if="${app.status.name() == 'APPLIED'}"
                              th:action="@{/student/withdraw/{id}(id=${app.applicationId})}"
                              method="post"
                              onsubmit="return confirm('Withdraw this application?')">
                            <button type="submit" class="btn btn-danger btn-sm">Withdraw</button>
                        </form>
                        <span th:unless="${app.status.name() == 'APPLIED'}" class="text-muted">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
